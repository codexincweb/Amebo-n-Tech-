name: PostgreSQL backup

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create compressed database dump
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          test -n "$DIRECT_URL"
          pg_dump "$DIRECT_URL" --no-owner --no-privileges | gzip -9 > amebo-n-tech-postgres.sql.gz
          test -s amebo-n-tech-postgres.sql.gz
      - name: Store backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: amebo-n-tech-postgres-${{ github.run_id }}
          path: amebo-n-tech-postgres.sql.gz
          retention-days: 30
          if-no-files-found: error
